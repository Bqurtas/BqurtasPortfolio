<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Barakat Qurtas</title>
  <link rel="icon" type="image/webp" href="/assets/logo.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,500;9..144,1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center;
      background: #f4f3f0; color: #232220; text-align: center; padding: 24px;
      font-family: 'JetBrains Mono', monospace; -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 480px; }
    .mark { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-size: 30px; display: inline-block; margin-bottom: 40px; letter-spacing: -0.01em; }
    .eyebrow { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: #9a988f; margin-bottom: 14px; }
    .num {
      font-family: 'Fraunces', serif; font-weight: 500; font-style: italic;
      font-size: clamp(110px, 24vw, 220px); line-height: 0.84; color: #232220; letter-spacing: -0.03em;
    }
    .num span { color: #b8b6b0; }
    h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: clamp(22px, 4vw, 28px); margin: 22px 0 12px; letter-spacing: -0.01em; }
    p { font-size: 12px; letter-spacing: 0.05em; color: #7a7870; line-height: 1.8; margin-bottom: 34px; }
    a {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 16px 32px; background: #232220; color: #f4f3f0; text-decoration: none;
      border-radius: 2px; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
      transition: background 0.3s ease, gap 0.3s ease;
    }
    a:hover { background: #000; gap: 16px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1a1a19; color: #ecebe8; }
      .num { color: #ecebe8; } .num span { color: #55544f; }
      p { color: #8a8984; } .eyebrow { color: #6a6963; } .mark { color: #ecebe8; }
      a { background: #ecebe8; color: #1a1a19; } a:hover { background: #fff; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="mark">Bq.</span>
    <div class="eyebrow">Error · 404</div>
    <div class="num">4<span>0</span>4</div>
    <h1>This page wandered off.</h1>
    <p>The page you're looking for doesn't exist — but the work is still here.</p>
    <a href="/">&larr;&nbsp; Back to the studio</a>
  </div>
</body>
</html>
