<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Barakat Qurtas</title>
  <link rel="icon" type="image/webp" href="/assets/logo.webp" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #efe6d2; color: #1a0f08; text-align: center; padding: 24px;
      font-family: 'JetBrains Mono', monospace;
    }
    .wrap { max-width: 460px; }
    .num {
      font-family: 'Fraunces', serif; font-weight: 500; font-style: italic;
      font-size: clamp(96px, 22vw, 200px); line-height: 0.9; color: #5a1a1a;
    }
    .num span { color: #c9a253; }
    h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 26px; margin: 18px 0 12px; }
    p { font-size: 13px; letter-spacing: 0.04em; color: #6b5238; line-height: 1.7; margin-bottom: 30px; }
    a {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 15px 30px; background: #1a0f08; color: #efe6d2; text-decoration: none;
      border-radius: 999px; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
      transition: background 0.3s ease;
    }
    a:hover { background: #5a1a1a; }
    .mark { font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; font-size: 30px; margin-bottom: 36px; display: inline-block; }
    .mark::after { content: '.'; color: #c9a253; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="mark">Bq</span>
    <div class="num">4<span>0</span>4</div>
    <h1>This page wandered off.</h1>
    <p>The page you're looking for doesn't exist — but the work is still here.</p>
    <a href="/">← Back to the studio</a>
  </div>
</body>
</html>
